<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobranzas CARMAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --ink:#18272A; --mute:#5F6E70; --line:#DCE2E0; --soft:#EAF0EE;
  --accent:#0F5B66; --accent-ink:#FFFFFF;
  --verde:#2E9E5B; --amarillo:#D9A700; --rojo:#C93A2F; --gris:#A8B3B1; --aldia:#A8B3B1; --azul:#2F6FD0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:var(--bg);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1718; --panel:#162224; --ink:#E4ECEA; --mute:#93A4A2; --line:#2A3A3C; --soft:#1D2D30; --accent:#4FB3BF; --accent-ink:#06282C; } }
:root[data-theme="dark"]{ --bg:#0F1718; --panel:#162224; --ink:#E4ECEA; --mute:#93A4A2; --line:#2A3A3C; --soft:#1D2D30; --accent:#4FB3BF; --accent-ink:#06282C; }
html{scroll-padding-top:env(safe-area-inset-top,0px)} *{box-sizing:border-box}
body{margin:0;background:var(--bg);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--mute);font-size:13px;margin-left:8px}
#periodo input,#periodo select{padding:4px 8px}
.lastimp{margin-left:auto;color:var(--mute);font-size:13px}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--mute);font-weight:600;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--accent)}
nav .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--ink)}
main{padding:20px;max-width:1400px;margin:0 auto}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em} .sub{color:var(--mute);margin:0 0 16px;max-width:75ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:7px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:#1F9D55;color:#fff;border-color:#1F9D55}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 10px}
textarea{width:100%;resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input[type=search]{min-width:240px;flex:1;max-width:360px}
.chipsel button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 11px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chipsel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--soft)} tbody tr.click{cursor:pointer}
td.num,th.num{text-align:right;white-space:nowrap}
.nm{font-weight:600} .cod{color:var(--mute);font-size:12px}
.mute{color:var(--mute)} .neg{color:var(--verde)} .small{font-size:12px}
/* semáforo: la pieza distintiva — un portalámparas de 3 luces */
.sema{display:inline-flex;flex-direction:column;gap:2px;padding:3px;border-radius:6px;background:#22302F;vertical-align:middle}
.sema i{width:8px;height:8px;border-radius:50%;background:#3A4746}
.sema.rojo i:nth-child(1){background:var(--rojo);box-shadow:0 0 6px var(--rojo)}
.sema.amarillo i:nth-child(2){background:var(--amarillo);box-shadow:0 0 6px var(--amarillo)}
.sema.verde i:nth-child(3){background:var(--verde);box-shadow:0 0 6px var(--verde)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--soft);margin:1px 3px 1px 0;white-space:nowrap}
.tag.warn{background:#F7E7C6;color:#6B4A00} .tag.bad{background:#F5D3CF;color:#7A1E15} .tag.ok{background:#D3EEDD;color:#14532D} .tag.info{background:#D6E4F7;color:#163E7A}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi .l{color:var(--mute);font-size:13px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:10px 0 6px}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)} .legend b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:860px){.grid2{grid-template-columns:1fr}}
.list li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none;display:flex;gap:8px;justify-content:space-between}
.list{margin:0;padding:0}
.drop{display:block;cursor:pointer;border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none} .scrim.open{display:block}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{background:var(--panel);padding:16px 20px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:20px}
.dtabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.dbody{padding:16px 20px;overflow-y:auto;flex:1}
.timeline{margin-top:14px}
.ev{border-left:3px solid var(--line);padding:6px 0 12px 14px;position:relative}
.ev.wa-in{border-color:#1F9D55} .ev.wa-out{border-color:var(--accent)} .ev.sys{border-color:var(--gris)}
.ev .meta{font-size:12px;color:var(--mute)}
.ev pre{white-space:pre-wrap;font-family:inherit;margin:4px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:600}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;display:none}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--mute)}
.msgprev{white-space:pre-wrap;font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px;max-width:70ch}
.obs{margin-top:10px;padding:8px 12px;border-left:4px solid var(--amarillo);background:var(--soft);border-radius:0 8px 8px 0;font-size:14px;font-weight:500}
.obs .l{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:1px}
.obsline{font-size:12px;margin-top:3px;padding-left:7px;border-left:3px solid var(--amarillo);font-weight:500;max-width:60ch}
.fgrid a,.list a{color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px;margin-top:10px;overflow-wrap:anywhere}
td.selc,th.selc{width:36px;text-align:center}
.selc{cursor:pointer;user-select:none;white-space:nowrap}
.selc input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);vertical-align:middle}
tbody tr.sel,tbody tr.sel:hover,.list li.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.list li .selc{flex:none} .list li a{flex:1}
.selbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:calc(100% - 40px);max-width:1360px;margin:0 auto 12px;padding:10px 14px;border:2px solid var(--accent);border-radius:10px;background:var(--panel);box-shadow:0 6px 24px rgba(10,20,22,.18)}
/* alerta de promesas incumplidas: visible en todas las pestañas */
.alertwrap{max-width:1400px;margin:0 auto;padding:0 20px}
.alerta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;margin-top:14px;border:1px solid var(--rojo);border-left-width:6px;background:color-mix(in srgb,var(--rojo) 9%,var(--panel));border-radius:10px;padding:10px 14px}
.albadge{min-width:28px;height:28px;border-radius:14px;background:var(--rojo);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.alver{margin-left:auto;font-weight:700;color:var(--rojo);white-space:nowrap}
.promal{color:var(--rojo);font-weight:700}
.alerta.rev{border-color:var(--amarillo);background:color-mix(in srgb,var(--amarillo) 12%,var(--panel))} .alerta.rev .albadge{background:var(--amarillo);color:#2B2100} .alerta.rev .alver{color:var(--ink)}
#quien input{padding:4px 8px;width:150px} #quien input.falta{border-color:var(--rojo)}
.hrow{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px} .hrow select{padding:4px 8px}
td textarea{min-width:240px}
.totline{display:flex;gap:4px 20px;flex-wrap:wrap;align-items:baseline;margin:0 0 10px}
.totline b{font-size:16px}
tfoot td{background:var(--soft);border-bottom:0;font-weight:600}
.telin{width:128px;padding:4px 8px!important;font-size:13px} .telin.bad{border-color:var(--rojo)!important} input.falta{border-color:var(--rojo)!important}
.tagbtn{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;margin-top:4px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(10,20,22,.45);padding:4vh 16px;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(880px,100%);overflow:hidden}
.mbox .dhead{border-radius:12px 12px 0 0}
.hidden{display:none!important}
/* pantalla de ingreso: tapa la app hasta que el usuario entra y se cargan los datos */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{width:100%;max-width:380px;padding:24px;display:flex;flex-direction:column;gap:14px}
.gatebox .brand{font-size:22px} .gatebox label.f{display:flex;flex-direction:column;gap:4px} .gatebox input{width:100%}
#gateForm{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="panel gatebox">
  <div class="brand">Cobranzas<small> · CARMAR</small></div>
  <div id="gateMsg" class="small mute" aria-live="polite">Conectando…</div>
  <div id="gateForm" class="hidden">
    <label class="f">Mail<input type="email" id="lgMail" autocomplete="username"></label>
    <label class="f">Contraseña<input type="password" id="lgPass" autocomplete="current-password"></label>
    <div class="row"><button class="btn pri" id="lgOk">Entrar</button><button class="btn" id="lgReset">Olvidé mi contraseña</button></div>
    <div id="lgErr" class="small" style="color:var(--rojo)" aria-live="polite"></div>
  </div>
  <div id="gateOut" class="hidden"><button class="btn" id="lgSalir">Salir</button></div>
</div></div>
<header>
  <div class="top"><div class="brand">Cobranzas<small id="empresaLbl"></small></div><div class="row small" id="periodo" style="gap:6px"></div><div class="row small" id="quien" style="gap:6px"></div><div class="lastimp"><span id="lastImp"></span><span id="saved"></span></div></div>
  <nav id="nav">
    <button data-t="resumen" class="on">Resumen</button>
    <button data-t="cobranza">A cobrar<span class="n" id="nCob">0</span></button>
    <button data-t="depurar">Depurar<span class="n" id="nDep">0</span></button>
    <button data-t="acuerdos">Acuerdos especiales<span class="n" id="nAcu">0</span></button>
    <button data-t="wa">Mensajes WhatsApp</button>
    <button data-t="importar">Importar Excel</button>
    <button data-t="ajustes">Ajustes</button>
  </nav>
</header>
<div class="alertwrap" id="alertas" aria-live="polite"></div>
<main id="main"></main>
<div class="selbar hidden" id="selbar" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Ficha de cliente"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Envío por WhatsApp"></div>
<div class="toast" id="toast"></div>
<script>
// ===== CORE (lógica pura, sin DOM) =====
const ESTADOS = ['Sin gestionar','Mensaje enviado','En conversación','Promesa de pago','Pagó parcial','No responde','En disputa','Derivar a vendedor','Cancelado'];
const ESTADOS_DEP = ['Pendiente','Pedido de ajuste','Resuelto'];

// Mensajes por defecto. PLANT_V1 son los textos de la versión anterior: si nadie los tocó, se actualizan solos a los nuevos.
const PLANT={
  preventivo:'Hola {cliente}, te escribe {gestor} de {empresa}. Te pasamos el estado de tu cuenta, con comprobantes próximos a vencer:\n{detalle}\nCualquier consulta, estamos a disposición. ¡Gracias!',
  recordatorio:'Hola {cliente}, ¿cómo estás? Te escribe {gestor} de {empresa}. Te pasamos el estado de tu cuenta: hay {vencido} vencido.\n{detalle}\n¿Nos confirmás cuándo podés regularizarlo? Gracias.',
  reclamo:'Hola {cliente}. Te escribe {gestor}, de la administración de {empresa}. Necesitamos regularizar tu cuenta: hay {vencido} vencido, con hasta {dias} días de atraso.\n{detalle}\nPor favor comunicate hoy para acordar la forma de pago.',
  promesa:'Hola {cliente}. Te escribe {gestor} de {empresa}: habíamos acordado un pago para el {promesa} y todavía no lo vemos acreditado.\n{detalle}\n¿Nos confirmás hoy cuándo lo realizás? Gracias.'
};
const PLANT_V1={
  preventivo:'Hola {cliente}! Te escribimos de {empresa}. Te recordamos que tenés comprobantes por {saldo} con vencimiento próximo:\n{detalle}\nCualquier consulta, estamos a disposición. ¡Gracias!',
  recordatorio:'Hola {cliente}, ¿cómo estás? Desde {empresa} te contamos que hay {vencido} vencido hace {dias} días:\n{detalle}\n¿Nos confirmás cuándo podés regularizarlo? Gracias.',
  reclamo:'Hola {cliente}. Desde la administración de {empresa} necesitamos regularizar el saldo vencido de {vencido} (hasta {dias} días de atraso):\n{detalle}\nPor favor comunicate hoy para acordar la forma de pago.',
  promesa:'Hola {cliente}. Te escribimos de {empresa}: habíamos acordado un pago para el {promesa} y todavía no lo vemos acreditado.\n{detalle}\n¿Nos confirmás hoy cuándo lo realizás? Gracias.'
};
function defaultState(){
  return {
    v:1,
    // sa/sr: días vencido desde los que la cuenta pasa a amarillo y a rojo (por debajo es verde) · pie: texto al final de cada mensaje
    config:{ desde:'2026-01-01', hasta:'', sa:30, sr:60, semV:2, promDias:2, residuo:10, empresa:'CARMAR', usuario:'', gestores:[], condV:2, pie:'' },
    comps:{}, clientes:{}, gest:{}, imports:[],
    plantillas:Object.assign({},PLANT)
  };
}

const SAN=/[.$#\[\]\/\x00-\x1f\x7f]/g; // caracteres prohibidos en claves de Firebase
const normH = h => String(h||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');

function serialToISO(v, SSF){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number'){ const p=SSF.parse_date_code(v); if(!p) return ''; return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`; }
  if(v instanceof Date){ return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; }
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100)y+=2000; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m? m[0] : '';
}
const num = v => { if(typeof v==='number') return v; const s=String(v||'').replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; };

// Lee el Excel y devuelve filas normalizadas
function leerHoja(XLSX, buf){
  const wb = XLSX.read(buf,{type:'array',cellFormula:false,cellHTML:false,cellText:false,cellStyles:false});
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  if(!aoa.length) throw new Error('La hoja está vacía.');
  return aoa;
}
// Reconoce el archivo por sus columnas: listado semanal de cobranzas o nómina de clientes
function tipoArchivo(aoa){
  const H=aoa[0].map(normH);
  if(H.includes('CODCLIENT')&&H.includes('RAZONSOCI')) return 'nomina';
  if(H.includes('CODCLI')&&H.includes('FECHAEMI')) return 'cobranzas';
  return '';
}
function parseWorkbook(XLSX, buf){ return parseCobranzas(XLSX, leerHoja(XLSX,buf)); }
function parseCobranzas(XLSX, aoa){
  const H = aoa[0].map(normH);
  const col = n => H.indexOf(n);
  const need = ['FECHAEMI','CODCLI','RAZONSOC','TCOMP','NCOMP','IMPORTE'];
  const faltan = need.filter(n=>col(n)<0);
  if(faltan.length) throw new Error('Faltan columnas: '+faltan.join(', '));
  const c = { vto:col('FECHAVTO'), emi:col('FECHAEMI'), cli:col('CODCLI'), rs:col('RAZONSOC'), dom:col('DOMICILIO'), loc:col('LOCALIDAD'),
    t1:col('TELEFONO1'), t2:col('TELEFONO2'), prov:col('NOMPROVI'), tipo:col('TCOMP'), nro:col('NCOMP'), impv:col('IMPVTO'), imp:col('IMPORTE'), vend:col('CODVEND') };
  const g = (r,i)=> i<0? '' : r[i];
  const rows=[];
  for(let i=1;i<aoa.length;i++){
    const r=aoa[i]; const cli=String(g(r,c.cli)).trim().replace(SAN,'_'); if(!cli) continue;
    const tipo=String(g(r,c.tipo)).trim(), nro=String(g(r,c.nro)).trim();
    rows.push({
      k: (cli+'|'+tipo+'|'+nro).replace(SAN,'_'), cli, tipo, nro,
      emi: serialToISO(g(r,c.emi),XLSX.SSF), vto: serialToISO(g(r,c.vto),XLSX.SSF),
      imp: Math.round(num(g(r,c.imp))*100)/100, impVto: Math.round(num(g(r,c.impv))*100)/100,
      vend: String(g(r,c.vend)).trim(),
      _cli:{ cod:cli, nombre:String(g(r,c.rs)).trim(), dom:String(g(r,c.dom)).trim(), loc:String(g(r,c.loc)).trim(),
        prov:String(g(r,c.prov)).trim(), tel1:String(g(r,c.t1)).trim(), tel2:String(g(r,c.t2)).trim(), vend:String(g(r,c.vend)).trim() }
    });
  }
  return rows;
}

// Lee la nómina de clientes (ficha completa). Devuelve una ficha compacta por código.
// n razón social · t1/t2 teléfonos · obs observaciones (cómo opera) · em email · ct/tc/cc/ec/oc contacto · cuit · nc nombre comercial · cv cond. venta · iva · inh fecha inhabilitación · dup otros códigos con el mismo CUIT
function parseNomina(aoa, SSF){
  const H=aoa[0].map(normH), col=n=>H.indexOf(n), pre=n=>H.findIndex(h=>h.startsWith(n));
  const ci=col('CODCLIENT');
  if(ci<0||col('RAZONSOCI')<0) throw new Error('No parece la nómina de clientes: faltan las columnas COD_CLIENT o RAZON_SOCI.');
  const M={n:col('RAZONSOCI'),t1:col('TELEFONO1'),t2:col('TELEFONO2'),obs:pre('OBSERVACI'),em:col('EMAIL'),ct:col('NOMCONTAC'),tc:col('TELCONTAC'),
    cc:col('CARGOCONT'),ec:col('EMAILCONT'),oc:col('OBSCONTAC'),cuit:col('IDENTIFTRI'),nc:col('NOMCOMERC'),cv:col('CONDVTA'),iva:col('TIPOIVA')};
  const ih=col('FECHAINHA'), txt=v=>String(v??'').replace(/[\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim();
  const fichas={}, noUsar=f=>/no usar/i.test(f.n||''); let repetidos=0;
  for(let i=1;i<aoa.length;i++){
    const r=aoa[i], cod=txt(r[ci]).replace(SAN,'_'); if(!cod) continue;
    const f={}; for(const k in M){ if(M[k]<0) continue; const v=txt(r[M[k]]); if(v) f[k]=v; }
    if(ih>=0){ const d=serialToISO(r[ih],SSF); if(d) f.inh=d; }
    if(f.nc&&f.nc===f.n) delete f.nc;
    if(fichas[cod]){ repetidos++; if(noUsar(f)||!noUsar(fichas[cod])) continue; } // código repetido: gana la fila que no dice "no usar"
    fichas[cod]=f;
  }
  const by={};
  for(const cod in fichas){ const d=(fichas[cod].cuit||'').replace(/\D/g,''); if(d.length===11&&!/^0+$/.test(d.slice(2,10))&&!/^(\d)\1+$/.test(d.slice(2,10))) (by[d]=by[d]||[]).push(cod); }
  for(const d in by) if(by[d].length>1&&by[d].length<=6) by[d].forEach(c=>{ fichas[c].dup=by[d].filter(x=>x!==c); });
  const cods=Object.keys(fichas);
  return {fichas, total:cods.length, conObs:cods.filter(c=>fichas[c].obs).length, repetidos};
}
const fichaDe=(F,cod)=>F[cod]||F[String(cod).replace(/^0+(?=.)/,'')]||null;

// Cruza la nómina con los clientes que hoy tienen comprobantes en el listado. No modifica nada.
function resumenNomina(state, fichas, prev, hoyISO){
  const A=analizar(state,hoyISO);
  const r={enListado:0,conFicha:0,conObs:0,sinFicha:[],celAntes:0,celDespues:0,sinTelAntes:0,sinTelDespues:0,ganan:[],inh:[],dup:[],obsCambian:0};
  for(const cod in A){
    r.enListado++;
    const c=state.clientes[cod]||{}, f=fichaDe(fichas,cod), man=(state.gest[cod]||{}).wa, a=mejorTel(c,null,man), d=mejorTel(c,f,man);
    if(f){ r.conFicha++; if(f.obs) r.conObs++; if(f.inh&&A[cod].saldoTotal>0) r.inh.push(cod); if(f.dup) r.dup.push(cod);
      const p=fichaDe(prev||{},cod); if(p&&(p.obs||'')!==(f.obs||'')) r.obsCambian++; }
    else r.sinFicha.push(cod);
    if(a&&a.tipo==='cel') r.celAntes++; if(d&&d.tipo==='cel') r.celDespues++;
    if(!a) r.sinTelAntes++; if(!d) r.sinTelDespues++;
    if((!a||a.tipo!=='cel')&&d&&d.tipo==='cel') r.ganan.push(cod);
  }
  return r;
}

// Compara el Excel nuevo con lo guardado. No toca gestiones.
function diffImport(state, rows){
  const seen=new Set(), nuevos=[], cambiados=[]; let iguales=0;
  for(const r of rows){
    if(seen.has(r.k)) continue; seen.add(r.k);
    const old=state.comps[r.k];
    if(!old || !old.activo) nuevos.push(r);
    else if(old.imp!==r.imp || old.vto!==r.vto) cambiados.push({r, antes:old.imp});
    else iguales++;
  }
  const saldados = Object.values(state.comps).filter(c=>c.activo && !seen.has(c.k));
  const clientesNuevos = new Set(nuevos.map(r=>r.cli).filter(c=>!state.clientes[c])).size;
  return {nuevos, cambiados, saldados, iguales, clientesNuevos, total:seen.size};
}

function applyImport(state, rows, diff, archivo, hoyISO){
  for(const r of rows){
    state.clientes[r.cli] = Object.assign(state.clientes[r.cli]||{}, r._cli);
    const old = state.comps[r.k];
    const base = {k:r.k, cli:r.cli, tipo:r.tipo, nro:r.nro, emi:r.emi, vto:r.vto, imp:r.imp, impVto:r.impVto, vend:r.vend, activo:true, lastSeen:hoyISO};
    if(old){
      if(old.activo && old.imp!==r.imp){ (old.hist=old.hist||[]).push({f:hoyISO, de:old.imp, a:r.imp}); }
      Object.assign(old, base); delete old.removedAt;
    } else state.comps[r.k] = Object.assign(base,{firstSeen:hoyISO});
  }
  for(const c of diff.saldados){ const x=state.comps[c.k]; if(x){ x.activo=false; x.removedAt=hoyISO; } }
  state.imports.unshift({fecha:hoyISO, archivo, nuevos:diff.nuevos.length, cambiados:diff.cambiados.length, saldados:diff.saldados.length, total:diff.total});
}

function periodo(cfg){ return {desde:cfg.desde||cfg.corte||'2026-01-01', hasta:cfg.hasta||''}; }
function diasEntre(aISO,bISO){ return Math.round((Date.parse(bISO+'T12:00:00')-Date.parse(aISO+'T12:00:00'))/864e5); }

// Semáforo por días de atraso: amarillo desde cfg.sa días vencido, rojo desde cfg.sr. Todo lo demás con deuda es verde (al día o vencido reciente).
function semDe(dias, cfg){ return dias>=(cfg.sr??60)?'rojo': dias>=(cfg.sa??30)?'amarillo':'verde'; }
function sumarDias(iso,n){ const d=new Date(Date.parse(iso+'T12:00:00')+n*864e5); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// Desde cuándo se cobra un comprobante. Por defecto, el vencimiento que trae el archivo de Tango.
// Solo si al cliente se le modificó la condición en la app: 'dias' a N días de la fecha de factura · 'mes' al cierre del mes de la factura · 'fecha' desde una fecha fija
function exigible(i, r){
  const rg=r&&r.regla; if(rg==='fecha'&&r.fecha) return r.fecha;
  if(!rg||rg==='vto'||rg==='fecha'||!i.emi) return i.vto||i.emi||'';
  if(rg==='mes'){ const y=+i.emi.slice(0,4), m=+i.emi.slice(5,7); return `${i.emi.slice(0,8)}${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; }
  if(rg==='dias') return sumarDias(i.emi, +r.dias||0);
  return i.vto||i.emi;
}

// Calcula la foto de cada cliente. condDe(cod) devuelve la condición de pago modificada en la app para ese cliente (o nada: se usa el vencimiento de Tango).
function analizar(state, hoyISO, condDe){
  const cfg=state.config, by={}, P=periodo(cfg);
  for(const c of Object.values(state.comps)){ if(!c.activo) continue; (by[c.cli]=by[c.cli]||[]).push(c); }
  const out={};
  for(const cod in by){
    const items=by[cod].sort((a,b)=>a.emi<b.emi?-1:1), gs=state.gest[cod]||{}, cond=condDe?condDe(cod):null;
    // Si en Depurar se marcó "pasar a cobrar", la deuda anterior al período se cobra junto con el resto
    const inc=!!(gs.dep&&gs.dep.cobrar), enPer=i=>(inc||i.emi>=P.desde)&&(!P.hasta||i.emi<=P.hasta);
    const nuevos=items.filter(enPer), viejos=inc?[]:items.filter(i=>i.emi<P.desde), posteriores=P.hasta?items.filter(i=>i.emi>P.hasta):[];
    const sum=a=>a.reduce((s,i)=>s+i.imp,0);
    const deudaNueva=nuevos.filter(i=>i.imp>0), credNuevos=nuevos.filter(i=>i.imp<0);
    const ex={}, incl=cond&&(cond.regla==='mes'||cond.regla==='fecha'); // al cierre de mes o con fecha fija, se cobra desde ese mismo día
    deudaNueva.forEach(i=>{ ex[i.k]=exigible(i,cond); });
    const vencidos=deudaNueva.filter(i=>ex[i.k] && (incl? ex[i.k]<=hoyISO : ex[i.k]<hoyISO)), noVenc=deudaNueva.filter(i=>!vencidos.includes(i));
    const diasMax=vencidos.reduce((m,i)=>Math.max(m,diasEntre(ex[i.k],hoyISO)),0);
    const saldoNuevo=sum(nuevos);
    let sem='none';
    if(sum(deudaNueva)>0) sem=semDe(diasMax,cfg);
    const flags=[];
    if(!nuevos.length && !posteriores.length) flags.push('soloViejos');
    if(viejos.some(i=>i.imp<0 && Math.abs(i.imp)>=cfg.residuo)) flags.push('credViejos');
    if(viejos.some(i=>i.imp>0 && i.imp>=cfg.residuo)) flags.push('deudaVieja');
    if(items.some(i=>Math.abs(i.imp)<cfg.residuo)) flags.push('residuos');
    if(sum(items)<0) flags.push('aFavor');
    if(nuevos.length && deudaNueva.length && items.some(i=>i.imp<=-cfg.residuo)) flags.push('imputar');
    const proxVto = noVenc.map(i=>ex[i.k]).filter(Boolean).sort()[0]||'';
    out[cod]={cod, items, nuevos, viejos, posteriores, saldoNuevo, deudaNueva:sum(deudaNueva), credNuevos:sum(credNuevos), vencido:sum(vencidos), aVencer:sum(noVenc),
      vencidos, noVenc, ex, cond, diasMax, sem, flags, saldoTotal:sum(items), saldoViejo:sum(viejos), proxVto,
      incViejos: inc && items.some(i=>i.emi<P.desde && i.imp>0), // trae deuda anterior al período, ya revisada
      excl:!!gs.excl}; // acuerdo especial: no entra en la cobranza
  }
  return out;
}

// Teléfonos. Los campos del sistema son texto libre ("4232957  155044500 PATRICIA"), así que se extraen todos los números que haya.
// Formato wa.me: 549 + 10 dígitos. Asume característica 264 si el número viene local.
// tipo: 'cel' (celular), 'dudoso' (43x/49x sin 15: puede ser fijo), 'fijo' (42x sin 15: línea fija de San Juan)
function telsDe(raw, area='264'){
  const out=[], seen=new Set();
  const uno=p=>{
    let d=String(p).replace(/\D/g,''), movil=false;
    if(d.length<7) return null;
    if(d.startsWith('00')) d=d.slice(2);
    if(d.startsWith('549')&&d.length===13){ d=d.slice(3); movil=true; }
    else if(d.startsWith('54')&&d.length===12) d=d.slice(2);
    if(d.startsWith('0')) d=d.slice(1);
    if(d.length===12){ const k=(d.startsWith('11')&&d.substr(2,2)==='15')?2: d.substr(3,2)==='15'?3: d.substr(4,2)==='15'?4:-1; if(k>0){ d=d.slice(0,k)+d.slice(k+2); movil=true; } }
    if(d.length===9&&d.startsWith('15')){ d=area+d.slice(2); movil=true; }
    if(d.length===7) d=area+d;
    if(d.length!==10||/^(\d)\1+$/.test(d.slice(3))) return null;
    let tipo='cel';
    if(!movil&&d.startsWith(area)){ const p2=d.substr(area.length,2); tipo= p2==='42'?'fijo': (p2==='43'||p2==='49')?'dudoso':'cel'; }
    const ac=d.startsWith('11')?2:3;
    return {wa:'549'+d, ver:d.slice(0,ac)+' '+d.slice(ac), tipo, verificar:tipo!=='cel'};
  };
  const push=t=>{ if(!t) return false; if(!seen.has(t.wa)){ seen.add(t.wa); out.push(t); } return true; };
  for(const pieza of String(raw||'').split(/[\/,;:|]|[^\d\s\-.()+]+/)){
    const s=pieza.trim(); if(!s) continue;
    const tk=s.split(/\s+/); let hubo=false;
    for(let i=0;i<tk.length;i++){
      let junto=false; // "264 4123456", "154 553989", "+54 9 264 4123456": característica y número separados por espacios
      for(let n=Math.min(4,tk.length-i); n>=2&&!junto; n--){
        if(!tk.slice(i,i+n-1).every(x=>{const l=x.replace(/\D/g,'').length; return l>=1&&l<=4;})) continue;
        const t=uno(tk.slice(i,i+n).join('')); if(t){ push(t); hubo=true; i+=n-1; junto=true; }
      }
      if(junto) continue;
      if(push(uno(tk[i]))){ hubo=true; continue; }
      if(tk[i].includes('-')) tk[i].split('-').forEach(x=>{ if(push(uno(x))) hubo=true; });
    }
    if(!hubo&&tk.length>1) push(uno(s));
  }
  return out;
}
const RANK_TEL={cel:3,dudoso:2,fijo:1};
const mejorDe=L=>L.reduce((b,t)=>!b||RANK_TEL[t.tipo]>RANK_TEL[b.tipo]?t:b,null);
function normTel(raw, area='264'){ return mejorDe(telsDe(raw,area)); }
// Todos los teléfonos de un cliente: los del listado de cobranzas y los de la nómina, sin repetir
function candsTel(cli, f){
  const L=[], seen=new Set();
  const add=(raw,src)=>{ if(!raw) return; telsDe(raw).forEach(t=>{ if(!seen.has(t.wa)){ seen.add(t.wa); L.push(Object.assign(t,{src,raw:String(raw).trim()})); } }); };
  cli=cli||{}; f=f||{};
  add(cli.tel1,'Listado de cobranzas'); add(cli.tel2,'Listado de cobranzas');
  add(f.t1,'Nómina · teléfono 1'); add(f.t2,'Nómina · teléfono 2'); add(f.ct,'Nómina · contacto'); add(f.tc,'Nómina · contacto');
  return L;
}
// El número que se usa para WhatsApp: el cargado a mano si existe; si no, el mejor candidato (celular antes que fijo)
function mejorTel(cli, f, manual){
  if(manual){ const t=normTel(manual); if(t) return Object.assign(t,{tipo:'cel',verificar:false,src:'Cargado a mano'}); }
  return mejorDe(candsTel(cli,f));
}

// Arma el mensaje con TODA la deuda del cliente: lo vencido y lo que está por vencer, cada bloque con su subtotal, y el total al final.
function armarMensaje(tpl, cli, a, empresa, fmt, extra){
  const x=extra||{}, f=iso=>iso?iso.split('-').reverse().join('/'):'', ex=a.ex||{}, MAXL=8, Ve=a.vencidos, Nv=a.noVenc||[], L=[];
  const lin=(arr,pal)=>{ const o=arr.slice(0,MAXL).map(i=>`• ${i.tipo} ${i.nro} — ${pal} ${f(ex[i.k]||i.vto)} — ${fmt(i.imp)}`); if(arr.length>MAXL) o.push(`… y ${arr.length-MAXL} comprobante(s) más`); return o; };
  if(Ve.length&&Nv.length) L.push('VENCIDO', ...lin(Ve,'venció'), `Subtotal vencido: ${fmt(a.vencido)}`, '', 'A VENCER', ...lin(Nv,'vence'), `Subtotal a vencer: ${fmt(a.deudaNueva-a.vencido)}`, '');
  else L.push(...lin(Ve.length?Ve:Nv, Ve.length?'venció':'vence'));
  const cred=-(a.credNuevos||0), total=cred>=1?Math.max(0,a.deudaNueva-cred):a.deudaNueva;
  if(cred>=1) L.push(`Pagos o créditos a cuenta sin aplicar: -${fmt(cred)}`);
  L.push(`${cred>=1?'TOTAL A PAGAR':'TOTAL DE LA DEUDA'}: ${fmt(total)}`);
  const V={cliente:cli.nombre||'', empresa:empresa||'', gestor:x.gestor||'', saldo:fmt(total), total:fmt(total), vencido:fmt(a.vencido), dias:String(a.diasMax), promesa:x.promesa||'', detalle:L.join('\n')};
  const msg=tpl.replace(/\{(cliente|empresa|gestor|saldo|total|vencido|dias|promesa|detalle)\}/g, (m,k)=>V[k]);
  return x.pie? msg+'\n\n'+x.pie : msg;
}

// Procesa el Excel semanal sobre una copia del estado y devuelve qué pasó con cada cliente.
function procesarImport(state, rows, archivo, hoyISO){
  const T=JSON.parse(JSON.stringify(state));
  const primera=Object.keys(T.comps).length===0;
  const diff=diffImport(T,rows), antes=analizar(T,hoyISO);
  applyImport(T,rows,diff,archivo,hoyISO);
  const desp=analizar(T,hoyISO);
  const porCli={}, add=(cli,k,x)=>{(porCli[cli]=porCli[cli]||{salen:[],entran:[],cambian:[]})[k].push(x)};
  if(!primera){ diff.saldados.forEach(c=>add(c.cli,'salen',c)); diff.nuevos.forEach(r=>{ if(state.clientes[r.cli]) add(r.cli,'entran',r); }); diff.cambiados.forEach(x=>add(x.r.cli,'cambian',x)); }
  const ev={depResueltas:[],depParciales:[],nuevasDep:[],canceladas:[],reactivadas:[],marcadosQueSiguen:[],conCambios:Object.keys(porCli)};
  const g=cod=>T.gest[cod]||(T.gest[cod]={estado:'Sin gestionar',log:[],promesa:null,dep:{estado:'Pendiente',nota:''},wa:''});
  const now=new Date().toISOString(); let seq=0; const log=(cod,texto)=>g(cod).log.push({id:Date.now()+'_'+(seq++),f:now,tipo:'Sistema',texto,usuario:'',auto:true});
  const $n=n=>'$'+Math.round(n).toLocaleString('es-AR'), li=c=>`• ${c.tipo} ${c.nro} ${$n(c.imp)}`;
  if(!primera){
    for(const cod in antes){ const a=antes[cod], d=desp[cod];
      if(a.flags.length && (!d||!d.flags.length)) ev.depResueltas.push(cod);
      else if(d && d.flags.length && a.viejos.length>d.viejos.length) ev.depParciales.push(cod);
      if(a.deudaNueva>0 && (!d||d.deudaNueva<=0)) ev.canceladas.push(cod);
    }
    for(const cod in desp){ const d=desp[cod], a=antes[cod];
      if(d.flags.length && (!a||!a.flags.length)) ev.nuevasDep.push(cod);
      if(d.flags.length && T.gest[cod] && T.gest[cod].dep && T.gest[cod].dep.estado==='Resuelto') ev.marcadosQueSiguen.push(cod);
      if(d.deudaNueva>0 && T.gest[cod] && T.gest[cod].estado==='Cancelado') ev.reactivadas.push(cod);
    }
    for(const cod in porCli){ const p=porCli[cod], L=[];
      if(p.salen.length) L.push(`Salieron ${p.salen.length} comprobante(s) (cobrados, imputados o anulados):\n`+p.salen.slice(0,10).map(li).join('\n'));
      if(p.entran.length) L.push(`Entraron ${p.entran.length} comprobante(s) nuevo(s):\n`+p.entran.slice(0,10).map(li).join('\n'));
      if(p.cambian.length) L.push(`Cambió el importe de ${p.cambian.length}:\n`+p.cambian.slice(0,10).map(x=>`• ${x.r.tipo} ${x.r.nro} ${$n(x.antes)} → ${$n(x.r.imp)}`).join('\n'));
      log(cod,`Actualización con ${archivo}\n`+L.join('\n'));
    }
    ev.depResueltas.forEach(cod=>{ const G=g(cod); G.dep=Object.assign({},G.dep,{estado:'Resuelto',resueltoEn:hoyISO,auto:true}); log(cod,'Depuración resuelta: el Excel ya no trae comprobantes viejos ni créditos pendientes de este cliente.'); });
    ev.nuevasDep.forEach(cod=>{ const G=g(cod); if(G.dep&&G.dep.estado==='Resuelto'){ G.dep=Object.assign({},G.dep,{estado:'Pendiente',auto:false}); delete G.dep.resueltoEn; log(cod,'Volvió a depuración: aparecieron comprobantes para revisar.'); } });
    ev.canceladas.forEach(cod=>{ const G=g(cod), pr=G.promesa; G.estado='Cancelado'; G.promesa=null; log(cod,'Cuenta del período cancelada: no quedan facturas pendientes.'+(pr&&pr.fecha?` Había promesa de pago para el ${pr.fecha.split('-').reverse().join('/')}.`:'')); });
    ev.reactivadas.forEach(cod=>{ g(cod).estado='Sin gestionar'; log(cod,'Volvió a tener deuda: entraron facturas nuevas.'); });
  }
  T.imports[0].eventos={depResueltas:ev.depResueltas.length,canceladas:ev.canceladas.length,nuevasDep:ev.nuevasDep.length,conCambios:ev.conCambios.length};
  return {T,diff,ev,porCli,primera};
}

  residuos:['Residuos de centavos','info'],aFavor:['Saldo a favor del cliente','info'],imputar:['Créditos para imputar contra facturas','ok']};
const SEMN={rojo:'Rojo',amarillo:'Amarillo',verde:'Verde',none:'—'}, SEMK=['rojo','amarillo','verde'];
const semRango=k=>{ const c=S.config; return k==='rojo'?`${c.sr} días vencido o más`: k==='amarillo'?`de ${c.sa} a ${c.sr-1} días vencido`: k==='verde'?`al día o con menos de ${c.sa} días vencido`:''; };
const semCorto=k=>k==='verde'?`Verde · menos de ${S.config.sa} días`:`${SEMN[k]} · ${S.config[k==='rojo'?'sr':'sa']}+ días`;
// Condiciones de pago: cómo se cobra cada categoría de cliente

// ---------- CELULAR EN LA FILA + SELECCIÓN ----------
// Celda de WhatsApp de una fila: botón si hay número; si no, un campo para cargarlo ahí mismo
function celdaWA(cod,editar){ const t=telWA(cod);
  if(!t||editar) return `<input type="text" class="telin" data-tel="${esc(cod)}" placeholder="${t?'Otro celular':'Cargar celular'}" aria-label="Cargar celular para WhatsApp" inputmode="tel" autocomplete="off">`;
  return `<button class="btn wa sm" data-wa="${esc(cod)}">WhatsApp</button>${t.verificar?`<div><button class="tag ${TELTAG[t.tipo][1]} tagbtn" data-cambiar="${esc(cod)}" title="Cargar otro número para este cliente">${TELTAG[t.tipo][0]} · cambiar</button></div>`:''}`; }
// Guarda el celular cargado a mano (queda aparte: no lo pisan el Excel ni la nómina). Devuelve true si quedó guardado.
function guardarTel(cod,inp){ const v=inp.value.trim(); if(!v) return false; const t=normTel(v);
  if(!t){ inp.classList.add('bad'); toast('Ese número no parece válido: van 10 dígitos con característica (264 4123456) o el local con 15.'); return false; }
  G(cod).wa=v; save(); toast(`Celular guardado para ${(S.clientes[cod]||{}).nombre||cod}: ${t.ver}`); return true; }
// Engancha los campos de celular de una tabla. alGuardar(cod, celda) decide qué se redibuja.
function bindTel(tb,alGuardar){
  tb.addEventListener('change',e=>{ const i=e.target.closest('.telin'); if(!i) return; const cod=i.dataset.tel, td=i.closest('td'); if(guardarTel(cod,i)) alGuardar(cod,td); else if(!i.value.trim()&&telWA(cod)) td.innerHTML=celdaWA(cod); });
  tb.addEventListener('keydown',e=>{ const i=e.target.closest('.telin'); if(!i) return; i.classList.remove('bad');
    if(e.key==='Enter'){ e.preventDefault(); const v=i.value.trim(), ok=!v||!!normTel(v), all=[...tb.querySelectorAll('.telin')], nx=all[all.indexOf(i)+1]; i.blur();
      if(!ok){ i.focus(); return; } if(nx&&document.contains(nx)) nx.focus(); } // Enter guarda y salta al próximo cliente sin celular
    if(e.key==='Escape'){ e.stopPropagation(); const td=i.closest('td'), cod=i.dataset.tel; i.value=''; if(td.dataset.telc&&telWA(cod)) td.innerHTML=celdaWA(cod); else i.blur(); } });
}
// ---------- TILDES: se pueden elegir clientes en todas las pestañas y la selección se mantiene al cambiar de una a otra ----------
const selTh=()=>'<th class="selc" data-selall="1" title="Elegir todos los de esta lista"><input type="checkbox" aria-label="Elegir todos los de esta lista"></th>';

// root: tabla o panel con filas [data-selrow], tildes [data-sel] y, si hay, un "elegir todos" [data-selall]. Mayús + clic elige el tramo completo.
function bindSel(root){ let last=null; root.dataset.selroot='1';
  root.addEventListener('click',e=>{ const ha=e.target.closest('[data-selall]'), sc=!ha&&e.target.closest('[data-sel]'); if(!ha&&!sc) return; e.stopPropagation();
    const rows=[...root.querySelectorAll('[data-selrow]')];
    if(ha){ const cb=ha.querySelector('input'); if(e.target!==cb) cb.checked=!cb.checked; rows.forEach(r=>cb.checked?ui.sel.add(r.dataset.selrow):ui.sel.delete(r.dataset.selrow)); last=null; }
    else { const cb=sc.querySelector('input'), ix=rows.indexOf(sc.closest('[data-selrow]')); if(e.target!==cb) cb.checked=!cb.checked;
      const d=e.shiftKey&&last!=null?Math.min(last,ix):ix, h=e.shiftKey&&last!=null?Math.max(last,ix):ix;
      for(let k=d;k<=h;k++) cb.checked?ui.sel.add(rows[k].dataset.selrow):ui.sel.delete(rows[k].dataset.selrow); last=ix; }
    selSync(); },true); }
function selSync(){ document.querySelectorAll('#main [data-selrow]').forEach(r=>{ const on=ui.sel.has(r.dataset.selrow), cb=r.querySelector('[data-sel] input'); if(cb) cb.checked=on; r.classList.toggle('sel',on); });

// all: todos los tildados · L: a los que se les puede enviar (tienen deuda del período y no tienen acuerdo especial)

// WhatsApp no deja que una página mande mensajes sola: se abre un chat por clic, con el texto ya armado, y la app lleva la cuenta.
function abrirMasivo(){ const L=selInfo().L; if(!L.length) return;
  const vis=[...new Set([...document.querySelectorAll('#main [data-selrow]')].map(r=>r.dataset.selrow))].filter(c=>L.includes(c)), resto=L.filter(c=>!vis.includes(c));
  ui.mass={list:vis.concat(resto),done:{},tpl:'auto'}; renderMasivo(); $('#modal').classList.add('open'); const b=$('#mnext'); if(b) b.focus(); }
function cerrarMasivo(limpiar){ $('#modal').classList.remove('open'); $('#modal').innerHTML=''; if(limpiar) ui.sel.clear(); else if(ui.mass) Object.keys(ui.mass.done).forEach(c=>{ if(ui.mass.done[c]==='ok') ui.sel.delete(c); }); ui.mass=null; render(); }
function renderMasivo(){
  const M=ui.mass, tot=M.list.length, nOk=M.list.filter(c=>M.done[c]==='ok').length, nSk=M.list.filter(c=>M.done[c]==='skip').length;
  const sinTel=M.list.filter(c=>!M.done[c]&&!telWA(c)), next=M.list.find(c=>!M.done[c]&&telWA(c)), lim=new Date(Date.now()-3*864e5).toISOString();
  const TP={auto:'Según el semáforo de cada cliente (y promesa incumplida, si tiene)',preventivo:'Preventivo para todos',recordatorio:'Recordatorio para todos',reclamo:'Reclamo para todos',promesa:'Promesa incumplida (a quien no tiene promesa, según semáforo)'};
  const MD={wame:'Automático (enlace wa.me, una pestaña por cliente)',web:'WhatsApp Web (reutiliza siempre la misma pestaña)',app:'WhatsApp instalado en esta PC'};
  const msgDe=cod=>mensajeDe(cod,M.tpl), deudaT=M.list.reduce((s,c)=>s+A[c].deudaNueva,0), vencT=M.list.reduce((s,c)=>s+A[c].vencido,0);
  const aviso=cod=>{ const g=peekG(cod), u=ultGest(cod), x=[], p=prom(cod); if(p) x.push(p.est==='alerta'?`<span class="tag bad">promesa del ${fd(p.fecha)} incumplida</span>`:`<span class="tag info">promesa ${fd(p.fecha)}</span>`); if(g.estado==='En disputa') x.push('<span class="tag bad">en disputa</span>'); if(u&&u.f>=lim&&!M.done[cod]) x.push(`<span class="tag warn">gestionado el ${fd(u.f)}</span>`); return x.join(''); };
  let top;
  if(next){ const t=telWA(next), a=A[next];
    top=`<div class="panel" style="padding:14px"><div class="small mute">Siguiente · ${nOk+nSk+1} de ${tot}</div>
      <div class="nm" style="font-size:17px">${esc(S.clientes[next].nombre)}</div>
      <div class="small">${semHTML(a.sem)} ${esc(t.ver)}${telTag(t)} · deuda total ${fmt(a.deudaNueva)} · vencido ${fmt(a.vencido)} · ${a.diasMax} días ${aviso(next)}</div>${obsLine(next)}
      <div class="msgprev" style="margin:10px 0;max-width:none">${esc(msgDe(next))}</div>
      <div class="row"><button class="btn wa" id="mnext">Abrir WhatsApp y pasar al siguiente</button><button class="btn" id="mskip">Saltar este cliente</button></div></div>`;
  } else {
    top=`<div class="panel" style="padding:14px"><b>${nOk||nSk?'Listo.':'Ninguno de los elegidos tiene teléfono.'}</b> ${nOk} ${nOk===1?'chat abierto':'chats abiertos'}${nSk?`, ${nSk} salteado(s)`:''}${sinTel.length?`. Quedan ${sinTel.length} sin teléfono: cargalo abajo y entran en la tanda.`:'.'}
      <div class="row" style="margin-top:10px"><button class="btn pri" id="mfin">Cerrar y quitar la selección</button></div></div>`; }
  $('#modal').innerHTML=`<div class="mbox"><div class="dhead"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>WhatsApp a ${tot} ${tot===1?'cliente':'clientes'}</h3><button class="btn" id="mclose">Cerrar</button></div>
    <div class="small mute" style="margin-top:4px;max-width:75ch">Cada clic abre el chat del cliente con el mensaje ya escrito; en WhatsApp apretás Enviar y volvés acá. La app registra el envío en la ficha${S.config.usuario?', a nombre de '+esc(S.config.usuario)+',':''} y pasa al siguiente. <b>Total de la tanda: ${fmt(deudaT)}</b> de deuda, ${fmt(vencT)} vencido.</div>
    <div class="formgrid" style="margin:12px 0 0"><label class="f">Mensaje<select id="mtpl">${Object.entries(TP).map(([k,v])=>`<option value="${k}" ${M.tpl===k?'selected':''}>${v}</option>`).join('')}</select></label>
     ${S.config.usuario?'':'<label class="f">Tu nombre (va en el mensaje)<input type="text" id="mq" list="usrL" placeholder="Quién envía" autocomplete="off" class="falta"></label>'}
     <label class="f">Abrir con<select id="mmodo">${Object.entries(MD).map(([k,v])=>`<option value="${k}" ${(S.config.waModo||'wame')===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <div class="bar" style="margin-bottom:0"><span style="width:${tot?(nOk+nSk)/tot*100:0}%;background:#1F9D55"></span></div></div>
   <div class="dbody" style="overflow:visible">${top}
    <div class="panel tblwrap" style="margin-top:12px"><table><thead><tr><th>Estado</th><th>Cliente</th><th>Celular</th><th class="num">Deuda total</th><th class="num">Vencido</th><th></th></tr></thead><tbody id="mlist">
    ${M.list.map(cod=>{ const t=telWA(cod), a=A[cod], d=M.done[cod];
      return `<tr><td>${d==='ok'?'<span class="tag ok">chat abierto</span>':d==='skip'?'<span class="tag">salteado</span>':!t?'<span class="tag bad">sin teléfono</span>':cod===next?'<span class="tag info">siguiente</span>':'<span class="tag">pendiente</span>'}</td>
       <td><b>${esc(S.clientes[cod].nombre)}</b><div class="cod">${esc(cod)} ${aviso(cod)}</div></td>
       <td class="small">${t?esc(t.ver)+telTag(t):celdaWA(cod)}</td><td class="num">${fmt(a.deudaNueva)}</td><td class="num">${fmt(a.vencido)}</td>
       <td>${d?`<button class="btn sm" data-volver="${esc(cod)}">${d==='ok'?'Repetir':'Incluir'}</button>`:t&&cod!==next?`<button class="btn sm" data-saltar="${esc(cod)}">Saltar</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div></div>`;
  $('#mclose').onclick=()=>cerrarMasivo(false); const fin=$('#mfin'); if(fin) fin.onclick=()=>cerrarMasivo(true);
  const mq=$('#mq'); if(mq) mq.onchange=e=>{ setUsuario(e.target.value); renderMasivo(); };
  $('#mtpl').onchange=e=>{M.tpl=e.target.value;renderMasivo();}; $('#mmodo').onchange=e=>{S.config.waModo=e.target.value;save();};
  const nx=$('#mnext'); if(nx){ nx.onclick=()=>{ if(enviarWA(next,false,M.tpl,true)) M.done[next]='ok'; renderMasivo(); const b=$('#mnext')||$('#mfin'); if(b) b.focus(); };
    $('#mskip').onclick=()=>{ M.done[next]='skip'; renderMasivo(); const b=$('#mnext')||$('#mfin'); if(b) b.focus(); }; }
  const tb=$('#mlist'); bindTel(tb,()=>{ renderMasivo(); const n=$('#mlist .telin')||$('#mnext'); if(n) n.focus(); });
  tb.onclick=e=>{ const v=e.target.closest('[data-volver]'); if(v){ delete M.done[v.dataset.volver]; renderMasivo(); return; } const s=e.target.closest('[data-saltar]'); if(s){ M.done[s.dataset.saltar]='skip'; renderMasivo(); } };
}

// ---------- COBRANZA ----------
function vCobranza(){
  const m=$('#main'); if(!hasData()){m.innerHTML=emptyCTA();return;}
  const f=ui.cob, all=cobrables(), nMod=all.filter(a=>a.cond).length;
  const vends=[...new Set(all.map(a=>S.clientes[a.cod].vend))].filter(Boolean).sort();
  const resps=[...new Set(all.map(a=>peekG(a.cod).resp).filter(Boolean))].sort();
  let L=all.filter(a=>{const c=S.clientes[a.cod]; if(f.sem!=='todos'&&a.sem!==f.sem)return false; if(f.vend&&c.vend!==f.vend)return false;
    const g=peekG(a.cod); if(f.estado==='__promv'){ if(!promesaVencida(a.cod))return false;} else if(f.estado==='__alerta'){ const p=prom(a.cod); if(!p||p.est!=='alerta')return false; } else if(f.estado&&g.estado!==f.estado)return false;
    if(f.resp==='__no'){ if(g.resp)return false; } else if(f.resp&&g.resp!==f.resp)return false;
    if(f.cond==='__no'){ if(a.cond)return false; } else if(f.cond==='mod'&&!a.cond)return false;
    if(f.q&&!coincide(a.cod,f.q.toLowerCase()))return false; return true;});
  const key={nombre:a=>S.clientes[a.cod].nombre,deudaNueva:a=>a.deudaNueva,vencido:a=>a.vencido,diasMax:a=>a.diasMax,ult:a=>(ultima(a.cod)||{}).f||'',estado:a=>peekG(a.cod).estado}[f.sort];
  L.sort((x,y)=>{const a=key(x),b=key(y);return (a<b?-1:a>b?1:0)*f.dir});
  const c={todos:all.length}; all.forEach(a=>c[a.sem]=(c[a.sem]||0)+1);
  const sD=L.reduce((s,a)=>s+a.deudaNueva,0), sV=L.reduce((s,a)=>s+a.vencido,0), nAl=promAlertas().length;
  const enExc=f.q?Object.values(A).filter(a=>a.excl&&coincide(a.cod,f.q.toLowerCase())).length:0;
  const th=(k,t,n)=>`<th class="${n?'num':''}" data-s="${k}">${t}${f.sort===k?(f.dir<0?' ↓':' ↑'):''}</th>`;
  m.innerHTML=`<h2>Cuentas a cobrar</h2><p class="sub">Clientes con facturas emitidas ${perTxt()}. El color lo da el comprobante más atrasado, pero cada fila trae toda la deuda del cliente: lo vencido y lo que está por vencer. Tocá una fila para abrir la ficha y cargar la gestión; tildá varios para mandarles WhatsApp, asignarles responsable o pasarlos a Acuerdos especiales.</p>
  <div class="filters"><input type="search" id="fq" placeholder="Buscar cliente, código, CUIT u observación" value="${esc(f.q)}">
    <span class="chipsel" id="fsem">${['todos'].concat(SEMK).map(s=>`<button data-v="${s}" class="${f.sem===s?'on':''}" title="${s==='todos'?'':semRango(s)}">${s==='todos'?'Todos':`<span class="dot" style="background:var(--${s})"></span>${semCorto(s)}`} <span class="mute">${c[s]||0}</span></button>`).join(' ')}</span>
    <select id="fest"><option value="">Todos los estados</option>${ESTADOS.map(e=>`<option ${f.estado===e?'selected':''}>${e}</option>`).join('')}<option value="__alerta" ${f.estado==='__alerta'?'selected':''}>Promesa incumplida · alerta (${nAl})</option><option value="__promv" ${f.estado==='__promv'?'selected':''}>Promesa vencida (todas)</option></select>
    <select id="fresp" aria-label="Responsable"><option value="">Todos los responsables</option>${resps.map(v=>`<option ${f.resp===v?'selected':''}>${esc(v)}</option>`).join('')}<option value="__no" ${f.resp==='__no'?'selected':''}>Sin responsable</option></select>
    ${nMod||f.cond?`<select id="fcond" aria-label="Condición de pago"><option value="">Todas las condiciones de pago</option><option value="mod" ${f.cond==='mod'?'selected':''}>Condición modificada en la app (${nMod})</option><option value="__no" ${f.cond==='__no'?'selected':''}>Vencimiento de Tango</option></select>`:''}
    <select id="fven"><option value="">Todos los vendedores</option>${vends.map(v=>`<option ${f.vend===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
  <div class="totline"><span><b>${L.length}</b> ${L.length===1?'cliente':'clientes'}</span><span>Deuda total <b>${fmt(sD)}</b></span><span>Vencido <b style="color:var(--rojo)">${fmt(sV)}</b></span><span>A vencer <b>${fmt(sD-sV)}</b></span>${enExc?`<a href="#" id="verExc" class="small" style="color:var(--accent)">${enExc} ${enExc===1?'coincidencia':'coincidencias'} en Acuerdos especiales</a>`:''}</div>
  <div class="panel tblwrap"><table><thead><tr>${selTh()}<th></th>${th('nombre','Cliente')}${th('deudaNueva','Deuda total',1)}${th('vencido','Vencido',1)}${th('diasMax','Días',1)}${th('estado','Estado')}${th('ult','Última gestión')}<th>WhatsApp</th></tr></thead>
  <tbody>${L.slice(0,f.lim).map(a=>{const cl=S.clientes[a.cod],u=ultima(a.cod),g=peekG(a.cod);
    return `<tr class="click${ui.sel.has(a.cod)?' sel':''}" data-c="${a.cod}" data-selrow="${esc(a.cod)}">${selTd(a.cod)}<td>${semHTML(a.sem)}</td><td><div class="nm">${esc(cl.nombre)}</div><div class="cod">${a.cod} · vend ${esc(cl.vend)}${g.resp?' · resp. '+esc(g.resp):''}${a.cond?` · <span class="tag" title="Condición de pago modificada en la app para este cliente">cobra ${esc(condTxt(a.cond))}</span>`:''}${a.incViejos?' <span class="tag info" title="La deuda anterior al período se revisó en Depurar y se cobra junto con el resto">incluye deuda anterior</span>':''}${a.flags.some(x=>x!=='imputar'&&x!=='residuos')?' · <span class="tag warn">tiene viejos</span>':''}${a.flags.includes('imputar')?' <span class="tag ok">imputar créditos</span>':''}</div>${obsLine(a.cod)}</td>
    <td class="num">${fmt(a.deudaNueva)}${Math.abs(a.saldoTotal-a.deudaNueva)>=1?`<div class="small mute" title="Saldo de toda la cuenta en el listado: suma también lo anterior al período y resta los créditos sin imputar">saldo cuenta ${fmt(a.saldoTotal)}</div>`:''}</td>
    <td class="num">${a.vencido?fmt(a.vencido):'<span class="mute">—</span>'}${a.vencido&&a.aVencer>=1?`<div class="small mute">a vencer ${fmt(a.aVencer)}</div>`:''}</td><td class="num">${a.vencido?a.diasMax:(a.proxVto?'<span class="mute small">vence '+fd(a.proxVto)+'</span>':'')}</td>
    <td>${estadoTag(a.cod)}</td><td class="small">${u?`<b>${fd(u.f)}</b> ${esc(u.tipo)}${u.usuario?' · '+esc(u.usuario):''}<div class="mute">${esc((u.texto||'').slice(0,60))}</div>`:'<span class="mute">—</span>'}</td>
    <td data-telc="${a.cod}">${celdaWA(a.cod)}</td></tr>`}).join('')}</tbody>
  ${L.length?`<tfoot><tr><td colspan="3">Total · ${L.length} ${L.length===1?'cliente':'clientes'}</td><td class="num">${fmt(sD)}</td><td class="num">${fmt(sV)}</td><td colspan="4"></td></tr></tfoot>`:''}</table>
  ${L.length>f.lim?`<div style="padding:10px"><button class="btn" id="more">Mostrar más (${L.length-f.lim})</button></div>`:''}${!L.length?`<div class="empty">${f.estado==='__alerta'?'Ninguna promesa incumplida. Bien.':'Ningún cliente con estos filtros.'}</div>`:''}</div>`;
  $('#fq').oninput=e=>{f.q=e.target.value;clearTimeout(f._t);f._t=setTimeout(()=>{vCobranza();const i=$('#fq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)};
  $('#fsem').onclick=e=>{const b=e.target.closest('button');if(b){f.sem=b.dataset.v;vCobranza();}};
  $('#fest').onchange=e=>{f.estado=e.target.value;vCobranza()}; $('#fven').onchange=e=>{f.vend=e.target.value;vCobranza()};
  $('#fresp').onchange=e=>{f.resp=e.target.value;vCobranza()}; const fc=$('#fcond'); if(fc) fc.onchange=e=>{f.cond=e.target.value;vCobranza()};
  const ve=$('#verExc'); if(ve) ve.onclick=e=>{e.preventDefault();tab='acuerdos';ui.acu.f='todos';render();};
  bindSel(m.querySelector('table'));
  m.querySelector('thead').onclick=e=>{ const t=e.target.closest('th[data-s]');if(!t)return;if(f.sort===t.dataset.s)f.dir*=-1;else{f.sort=t.dataset.s;f.dir=t.dataset.s==='nombre'?1:-1;}vCobranza()};
  const tb=m.querySelector('tbody');
  tb.onclick=e=>{const w=e.target.closest('[data-wa]');if(w){e.stopPropagation();enviarWA(w.dataset.wa);return;}
    const cm=e.target.closest('[data-cambiar]'); if(cm){ const td=cm.closest('td'); td.innerHTML=celdaWA(cm.dataset.cambiar,true); td.querySelector('input').focus(); return; }
    if(e.target.closest('[data-telc]')) return;
    const r=e.target.closest('tr[data-c]');if(r)openCli(r.dataset.c)};
  bindTel(tb,(cod,td)=>{ td.innerHTML=celdaWA(cod); selBar(); });
  selSync();
  const mo=$('#more'); if(mo) mo.onclick=()=>{f.lim+=200;vCobranza()};
}

// ---------- ACUERDOS ESPECIALES ----------
// Clientes que no se gestionan por la vía normal. Cada uno lleva el motivo y, si corresponde, una fecha de corte para volver a mirarlo.
function vAcuerdos(){
  const m=$('#main'); if(!hasData()){m.innerHTML=emptyCTA();return;}
  const f=ui.acu, all=Object.values(A).filter(a=>a.excl), X=cod=>peekG(cod).excl||{}, toca=a=>{const r=X(a.cod).rev; return !!r&&r<=hoy();};
  const nRev=all.filter(toca).length, nSin=all.filter(a=>!X(a.cod).rev).length;
  const L=all.filter(a=>f.f==='rev'?toca(a):f.f==='sin'?!X(a.cod).rev:true).sort((a,b)=>{ const ra=X(a.cod).rev||'9999', rb=X(b.cod).rev||'9999'; return ra<rb?-1:ra>rb?1:b.deudaNueva-a.deudaNueva; });
  const sD=L.reduce((s,a)=>s+a.deudaNueva,0), sV=L.reduce((s,a)=>s+a.vencido,0);
  const corte=r=>{ if(!r) return '<div class="small mute">sin fecha: no se gestiona</div>'; const d=diasEntre(r,hoy()); return d>=0?`<div class="small promal">llegó la fecha${d?' · '+haceDias(d):' · hoy'}: revisar</div>`:`<div class="small mute">${d===-1?'falta 1 día':'faltan '+(-d)+' días'}</div>`; };
  m.innerHTML=`<h2>Acuerdos especiales</h2><p class="sub">Clientes que no se gestionan por la vía normal porque tienen un acuerdo especial. No aparecen en A cobrar, en los totales del Resumen, en las alertas de promesas ni en los envíos de WhatsApp. En cada uno queda escrito por qué y, si corresponde, una fecha de corte: cuando llega, la app avisa para decidir si se gestiona o sigue el acuerdo. El Excel semanal sigue actualizando sus comprobantes.</p>
  <div class="filters"><span class="chipsel" id="asw">${[['todos','Todos',all.length],['rev','Para revisar',nRev],['sin','Sin fecha de corte',nSin]].map(([k,t,n])=>`<button data-v="${k}" class="${f.f===k?'on':''}">${t} <span class="mute">${n}</span></button>`).join(' ')}</span></div>
  <div class="totline"><span><b>${L.length}</b> ${L.length===1?'cliente':'clientes'}</span><span>Deuda total <b>${fmt(sD)}</b></span><span>Vencido <b>${fmt(sV)}</b></span></div>
  <div class="panel tblwrap"><table><thead><tr><th></th><th>Cliente</th><th>Por qué tiene acuerdo y no se gestiona</th><th>Fecha de corte</th><th class="num">Deuda total</th><th class="num">Vencido</th><th>Desde</th><th></th></tr></thead><tbody>
  ${L.map(a=>{const cl=S.clientes[a.cod], x=X(a.cod);
    return `<tr data-c="${esc(a.cod)}"><td>${semHTML(a.sem)}</td><td data-open="1" style="cursor:pointer"><div class="nm">${esc(cl.nombre)}</div><div class="cod">${esc(a.cod)} · vend ${esc(cl.vend)}</div>${obsLine(a.cod)}</td>
    <td><textarea rows="2" data-mot="${esc(a.cod)}" placeholder="Ej.: paga con cheques a 90 días, lo maneja Gerencia" aria-label="Motivo del acuerdo">${esc(x.motivo||'')}</textarea></td>
    <td><input type="date" data-rev="${esc(a.cod)}" value="${esc(x.rev||'')}" aria-label="Fecha de corte" title="Fecha en la que hay que volver a mirar este acuerdo. Vacía: no se gestiona.">${corte(x.rev)}</td>
    <td class="num">${fmt(a.deudaNueva)}</td><td class="num">${a.vencido?fmt(a.vencido)+`<div class="small mute">${a.diasMax} días</div>`:'<span class="mute">—</span>'}</td>
    <td class="small">${fd(x.f)}${x.usuario?'<div class="mute">'+esc(x.usuario)+'</div>':''}</td><td><button class="btn sm" data-volver="${esc(a.cod)}">Volver a cobrar</button></td></tr>`}).join('')}</tbody></table>
  ${!L.length?`<div class="empty">${all.length?'Ninguno en este grupo.':'Ningún cliente con acuerdo especial. Para pasar uno acá, abrí su ficha y tocá «No cobrar (acuerdo especial)», o tildá varios en cualquier pestaña y usá el botón de la barra de abajo.'}</div>`:''}</div>`;
  $('#asw').onclick=e=>{const b=e.target.closest('button'); if(b){f.f=b.dataset.v; vAcuerdos();}};
  const tb=m.querySelector('tbody');
  tb.onchange=e=>{ const cm=e.target.dataset.mot, cr=e.target.dataset.rev, cod=cm||cr; if(!cod) return; const x=G(cod).excl=Object.assign({f:hoy()},G(cod).excl||{});
    if(cm){ x.motivo=e.target.value.trim(); save(); toast('Motivo guardado'); }
    else { x.rev=e.target.value; G(cod).log.push({id:Date.now()+'_r',f:ahora(),tipo:'Sistema',texto:x.rev?'Acuerdo especial: fecha de corte '+fd(x.rev)+'.':'Acuerdo especial: se quitó la fecha de corte.',usuario:S.config.usuario||'',auto:true}); save(); vAcuerdos(); toast(x.rev?'Fecha de corte guardada':'Sin fecha de corte'); } };
  tb.onclick=e=>{ const v=e.target.closest('[data-volver]'); if(v){ quitarExcl(v.dataset.volver); vAcuerdos(); toast('Volvió a A cobrar'); return; } const o=e.target.closest('[data-open]'); if(o) openCli(o.closest('tr').dataset.c); };
  selSync();
}

// ---------- DEPURAR ----------
function vDepurar(){
  const m=$('#main'); if(!hasData()){m.innerHTML=emptyCTA();return;}
  const f=ui.dep; if(f.vista==='res') return vResueltos(); const all=Object.values(A).filter(depPend);
  const cnt={todos:all.length}; all.forEach(a=>a.flags.forEach(x=>cnt[x]=(cnt[x]||0)+1));
  let L=all.filter(a=>{ if(f.flag!=='todos'&&!a.flags.includes(f.flag))return false; const g=peekG(a.cod); if(f.estado&&(g.dep||{}).estado!==f.estado)return false;
    if(f.q&&!coincide(a.cod,f.q.toLowerCase()))return false; return true;})
    .sort((a,b)=>Math.abs(b.saldoViejo)-Math.abs(a.saldoViejo));
  const sVj=L.reduce((s,a)=>s+a.saldoViejo,0), sTt=L.reduce((s,a)=>s+a.saldoTotal,0);

function plantillaPara(a){ const p=prom(a.cod); if(p&&p.est==='alerta') return 'promesa'; return !a.vencido?'preventivo':(a.sem==='rojo'||a.sem==='amarillo')?'reclamo':'recordatorio'; }
function mensajeDe(cod,tplKey){ const a=A[cod], p=prom(cod); let k=tplKey&&tplKey!=='auto'?tplKey:plantillaPara(a); if(k==='promesa'&&!p) k=plantillaPara(a);
  return armarMensaje(S.plantillas[k],S.clientes[cod],a,S.config.empresa,fmt2,{promesa:p?fd(p.fecha):'',gestor:S.config.usuario||'',pie:(S.config.pie||'').trim()}); }
const TPLN={preventivo:'Preventivo (todavía no venció)',recordatorio:'Recordatorio (vencido, en verde)',reclamo:'Reclamo (amarillo y rojo)',promesa:'Promesa de pago incumplida'};
// Grupos de la cola: los tres colores del semáforo, vencido reciente, por vencer y promesas incumplidas
function grupoWA(a,en7){ return a.sem!=='verde'?a.sem: a.vencido>0?'verde': (a.proxVto&&a.proxVto<=en7)?'porvencer':''; }
function colaWA(){ const f=ui.wa, lim=new Date(Date.now()-f.excluirDias*864e5).toISOString(), en7=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const L=f.sem==='promesa'? promAlertas().filter(enviable) : cobrables().filter(enviable).filter(a=>grupoWA(a,en7)===f.sem).filter(a=>{const p=prom(a.cod); return !(f.excluirPromesa&&p&&p.est==='vigente');});
  return L.filter(a=>{ if(peekG(a.cod).estado==='En disputa')return false; const u=ultGest(a.cod); if(!u||u.f<lim) return true;
      return f.sem==='promesa'&&u.f.slice(0,10)<=prom(a.cod).fecha; }) // en promesas incumplidas solo cuenta como gestión lo cargado después de la fecha prometida
   .sort((a,b)=>b.vencido-a.vencido||b.deudaNueva-a.deudaNueva); }

function abrirWA(t,msg){ const modo=S.config.waModo||'wame', tx=encodeURIComponent(msg), link=document.createElement('a');
  if(modo==='app') link.href='whatsapp://send?phone='+t.wa+'&text='+tx;
  else if(modo==='web'){ link.href='https://web.whatsapp.com/send?phone='+t.wa+'&text='+tx; link.target='wa_cobranzas'; }
  else { link.href='https://wa.me/'+t.wa+'?text='+tx; link.target='_blank'; link.rel='noopener'; }
  document.body.appendChild(link); link.click(); link.remove(); }
function enviarWA(cod,rerender,tplKey,enTanda){
  const a=A[cod], c=S.clientes[cod], t=telWA(cod);
  if(!a||a.deudaNueva<=0){ toast('Este cliente no tiene deuda del período para reclamar.'); return false; }
  if(a.excl){ toast('Tiene acuerdo especial: no se le envían mensajes de cobranza.'); return false; }
  if(!enviable(a)){ toast('Tiene pagos o créditos a cuenta que cubren la deuda: hay que imputarlos antes de reclamar.'); return false; }
  if(!requireUser()) return false;
  if(!t){toast('Este cliente no tiene celular válido. Cargalo en la ficha.'); if(!enTanda) openCli(cod,'datos'); return false;}
  const msg=mensajeDe(cod,tplKey);
  abrirWA(t,msg);
  const g=G(cod); g.log.push({id:Date.now(),f:ahora(),tipo:'WhatsApp enviado',texto:msg,usuario:S.config.usuario||'',auto:true}); asignar(cod);
  if(g.estado==='Sin gestionar') g.estado='Mensaje enviado'; save(); toast('Mensaje registrado en la ficha de '+c.nombre);
  if(enTanda) return true;
  if(rerender||tab==='cobranza') render(); if(ui.drawer===cod) renderDrawer(); return true;
}

async function leer(file){
  try{ if(typeof XLSX==='undefined') throw new Error('No cargó la librería de Excel. Revisá la conexión.');
    $('#diff').innerHTML=`<div class="panel" style="padding:14px">Leyendo ${esc(file.name)}… <span class="mute">la nómina completa puede tardar unos segundos.</span></div>`;
    const buf=new Uint8Array(await file.arrayBuffer()); await new Promise(r=>setTimeout(r,40));
    const aoa=leerHoja(XLSX,buf), tipo=tipoArchivo(aoa);
    if(tipo==='nomina'){ const nom=parseNomina(aoa,XLSX.SSF); if(!nom.total) throw new Error('No se encontraron clientes con COD_CLIENT.');
      ui.pend={tipo:'nomina',archivo:file.name,nom,res:resumenNomina(S,nom.fichas,N.f,hoy())}; }
    else if(tipo==='cobranzas'){ const rows=parseCobranzas(XLSX,aoa); if(!rows.length) throw new Error('No se encontraron filas con COD_CLI.');
      ui.pend={tipo:'cobranzas',rows,archivo:file.name,res:procesarImport(S,rows,file.name,hoy())}; ui.pend.diff=ui.pend.res.diff; }
    else throw new Error('No reconozco este archivo. El listado de cobranzas trae las columnas COD_CLI y FECHA_EMI; la nómina de clientes, COD_CLIENT y RAZON_SOCI.');
    vImportar();
  }catch(e){ $('#diff').innerHTML=`<div class="panel" style="padding:14px;border-color:var(--rojo)"><b>No se pudo leer el archivo.</b> ${esc(e.message)}</div>`; }
}
