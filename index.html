        <div class="meta"><b>${esc(e.tipo)}</b> · ${new Date(e.f).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}${e.usuario?' · '+esc(e.usuario):''}${e.estado?' · estado: '+esc(e.estado):''}
        <button class="btn sm" data-del="${e.id}" style="float:right;padding:0 7px" aria-label="Borrar gestión">×</button></div>${e.texto?`<pre>${esc(e.texto)}</pre>`:''}</div>`).join('')||'<div class="mute">Sin gestiones todavía.</div>'}</div>`;
  } else if(ui.dtab==='nuevos'){ body=`${a.incViejos?'<div class="note" style="margin-bottom:10px">Incluye la deuda anterior al período, que ya se revisó en Depurar.</div>':''}${compsTable(a.nuevos,a)}`;
  } else if(ui.dtab==='viejos'){ const dp=g.dep||{estado:'Pendiente',nota:''};
    body=`${a.flags.length?`<div style="margin-bottom:10px">${a.flags.map(x=>`<span class="tag ${FLAGS[x][1]}">${FLAGS[x][0]}</span>`).join('')}</div>`:''}
    <div class="row" style="margin-bottom:10px"><select id="dpe">${ESTADOS_DEP.map(e=>`<option ${dp.estado===e?'selected':''}>${e}</option>`).join('')}</select><input type="text" id="dpn" value="${esc(dp.nota)}" placeholder="Nota de depuración" style="flex:1"></div>
    ${dp.cobrar?'<div class="note" style="margin-bottom:10px">La deuda anterior al período de este cliente ya se revisó y se cobra junto con el resto: está en la solapa «A cobrar». <button class="btn sm" id="dpx" style="margin-left:6px">Volver a separarla</button></div>'
      :a.viejos.some(i=>i.imp>=S.config.residuo)?'<div class="row" style="margin-bottom:10px"><button class="btn" id="dpc">Pasar a cobrar esta deuda</button><span class="small mute">Si ya la revisaste y es deuda real: entra en A cobrar y en el mensaje, junto con el resto.</span></div>':''}
    ${compsTable(a.viejos)}`;
  } else { const cands=telCands(cod), IVA={RI:'Responsable inscripto',CF:'Consumidor final',EX:'Exento',RS:'Monotributo'};
    const dato=(l,v)=>v?`<div><div class="small mute">${l}</div><div>${v}</div></div>`:'';
    const mail=v=>v?(/^\S+@\S+\.\S+$/.test(v)?`<a href="mailto:${esc(v)}">${esc(v)}</a>`:esc(v)):'';
    body=`<div class="panel" style="padding:14px"><b>WhatsApp</b>
      <div class="formgrid" style="margin-top:8px"><label class="f">Celular para WhatsApp (cargado a mano)<input type="text" id="dwa" value="${esc(g.wa||'')}" placeholder="${t?esc(t.ver):'Ej: 264 4123456'}"></label></div>
      <div class="small ${t&&t.verificar?'':'mute'}">${t?`Se va a usar +${t.wa} · ${esc(t.src||'')}${t.verificar?(t.tipo==='fijo'?' — parece una línea fija: confirmalo o elegí otro número.':' — puede ser un fijo: confirmalo.'):''}`:'No hay un celular válido en el listado ni en la nómina. Cargalo arriba.'}</div>
      ${cands.length?`<div class="tblwrap" style="margin-top:10px"><table><thead><tr><th>Número</th><th>Tipo</th><th>De dónde sale</th><th></th></tr></thead><tbody>
        ${cands.map(x=>`<tr><td><b>${esc(x.ver)}</b></td><td><span class="tag ${TELTAG[x.tipo][1]}">${TELTAG[x.tipo][0]}</span></td><td class="small">${esc(x.src)}<div class="mute">${esc(x.raw)}</div></td>
        <td>${t&&t.wa===x.wa?'<span class="tag ok">en uso</span>':`<button class="btn sm" data-usar="${esc(x.ver)}">Usar</button>`}</td></tr>`).join('')}</tbody></table></div>`:''}
      <div class="note" style="margin-top:10px">El celular elegido o cargado a mano se guarda aparte: no lo pisan el Excel semanal ni la nómina.</div></div>
    <div class="panel" style="padding:14px;margin-top:12px"><b>Ficha de la nómina</b>${f&&N.meta?` <span class="small mute">· ${esc(N.meta.archivo)} (${fd(N.meta.fecha)})</span>`:''}
      ${!hayNomina()?'<div class="note" style="margin-top:8px">Todavía no se cargó la nómina de clientes. Subila desde Importar para ver acá cómo opera cada cliente, más teléfonos, email y CUIT.</div>'
       :!f?'<div class="note" style="margin-top:8px">Este código no figura en la nómina cargada.</div>'
       :`<div class="fgrid">${dato('Razón social',esc(f.n))}${dato('Nombre comercial',esc(f.nc))}${dato('CUIT / documento',esc(f.cuit))}${dato('Condición de IVA',IVA[f.iva]||esc(f.iva))}
         ${dato('Condición de venta',f.cv?'Código '+esc(f.cv):'')}${dato('Email',mail(f.em))}${dato('Contacto',[esc(f.ct),esc(f.cc),esc(f.tc),mail(f.ec)].filter(Boolean).join(' · '))}${dato('Observación del contacto',esc(f.oc))}
         ${dato('Inhabilitado',f.inh?`<span class="tag bad">desde ${fd(f.inh)}</span>`:'')}</div>
        ${f.dup?`<div class="small" style="margin-top:12px"><b>Mismo CUIT en otros códigos:</b><ul class="list" style="margin-top:4px">${f.dup.map(x=>{const o=ficha(x)||{}, ax=A[x]; return `<li>${ax?`<a href="#" data-open="${esc(x)}">${esc(x)} · ${esc(o.n||'')}</a>`:`<span>${esc(x)} · ${esc(o.n||'')}</span>`}<span class="mute">${ax?'saldo en el listado '+fmt(ax.saldoTotal):'sin comprobantes en el listado'}</span></li>`}).join('')}</ul></div>`:''}`}
      <div class="small mute" style="margin-top:12px">${esc(c.dom)} ${esc(c.loc)}${c.prov?' · '+esc(c.prov):''}${c.vend?' · Vendedor '+esc(c.vend):''}</div></div>`; }
  const obsBox = f&&f.obs ? `<div class="obs"><span class="l">Cómo opera · observaciones de la nómina</span>${esc(f.obs)}</div>`
    : hayNomina() ? `<div class="small mute" style="margin-top:8px">${f?'Sin observaciones en la nómina.':'Este código no figura en la nómina cargada.'}</div>` : '';
  const xr=g.excl&&g.excl.rev, xToca=xr&&xr<=hoy();
  const exclBox = g.excl ? `<div class="obs" style="border-color:var(--azul)"><span class="l">Acuerdo especial · no se gestiona por la vía normal</span>${esc(g.excl.motivo||'Sin motivo cargado')}<span class="small mute"> · desde el ${fd(g.excl.f)}${g.excl.usuario?' · '+esc(g.excl.usuario):''} · ${xr?'fecha de corte '+fd(xr):'sin fecha de corte'}</span>${xToca?' <span class="tag bad">llegó la fecha de corte: revisar</span>':''} <button class="btn sm" id="xoff" style="margin-left:6px">Volver a cobrar</button> <button class="btn sm" id="xver">Editar en Acuerdos especiales</button></div>`
    : ui.xform ? `<div class="obs" style="border-color:var(--azul)"><span class="l">Pasar a Acuerdos especiales: no se cobra por la vía normal</span><div class="row" style="margin-top:4px;align-items:flex-end"><label class="f" style="flex:1;min-width:220px">Por qué tiene acuerdo y no se gestiona<input type="text" id="xmot" placeholder="Ej.: paga con cheques a 90 días"></label><label class="f">Fecha de corte (opcional)<input type="date" id="xrev" title="Cuándo volver a mirar este acuerdo. Vacía: no se gestiona."></label><button class="btn pri" id="xok">Confirmar</button><button class="btn" id="xcx">Cancelar</button></div></div>` : '';
  const gc=g.cond&&typeof g.cond==='object'?g.cond:{}, cr=REGLAS[gc.regla]?gc.regla:'vto';
  d.innerHTML=`<div class="dhead"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>${esc(c.nombre)}</h3><div class="cod">Cliente ${esc(cod)} · vendedor ${esc(c.vend)}${f&&f.cuit?' · CUIT '+esc(f.cuit):''}${f&&f.inh?` <span class="tag bad">Inhabilitado desde ${fd(f.inh)}</span>`:''}</div></div><div class="row" style="gap:6px">${!g.excl&&!ui.xform&&A[cod]?'<button class="btn" id="xon">No cobrar (acuerdo especial)</button>':''}<button class="btn" id="dclose">Cerrar</button></div></div>
   ${exclBox}${obsBox}
   <div class="row" style="margin-top:10px;gap:18px">${semHTML(a.sem)}<div><div class="small mute">Deuda total</div><b>${fmt2(a.deudaNueva)}</b></div><div><div class="small mute">Vencido</div><b style="color:var(--rojo)">${fmt2(a.vencido)}</b></div><div><div class="small mute">A vencer</div><b>${fmt2(a.aVencer||0)}</b></div><div><div class="small mute">Atraso</div><b>${a.diasMax} días</b></div><div title="Todos los comprobantes del listado: suma también lo anterior al período y resta los créditos sin imputar"><div class="small mute">Saldo total de la cuenta</div><b>${fmt2(a.saldoTotal||0)}</b></div><div>${estadoTag(cod)}</div></div>
   <div class="hrow">${ui.respNew?`<label>Responsable <input type="text" id="hrespN" placeholder="Nombre y Enter" autocomplete="off" style="width:160px;padding:4px 8px" aria-label="Nombre del responsable"></label><button class="btn sm" id="hrespX">Cancelar</button>`
     :`<label>Responsable <select id="hresp"><option value="">Sin asignar</option>${gestoresOpts(g.resp||'')}<option value="__otro">Otro nombre…</option></select></label>`}
    <label>Condición de pago <select id="hcond">${Object.entries(REGLAS).map(([r,t])=>`<option value="${r}" ${cr===r?'selected':''}>${t}</option>`).join('')}</select></label>
    ${cr==='dias'?`<label><input type="number" id="hdias" min="0" value="${+gc.dias||0}" style="width:70px;padding:4px 8px" aria-label="Días desde la fecha de factura"> días</label>`:cr==='fecha'?`<label><input type="date" id="hfecha" value="${esc(gc.fecha||'')}" style="padding:4px 8px" aria-label="Fecha desde la que se cobra"></label>`:''}
    <span class="small mute">${REGLA_AYUDA[cr]}</span></div>
   <nav class="dtabs" id="dtabs">${tb('gestion','Gestiones ('+g.log.length+')')}${tb('nuevos','A cobrar ('+a.nuevos.length+')')}${tb('viejos','Viejos / depurar ('+a.viejos.length+')')}${tb('datos','Contacto')}</nav></div>
   <div class="dbody">${body}</div>`;
  const xon=$('#xon'); if(xon) xon.onclick=()=>{ ui.xform=true; renderDrawer(); const i=$('#xmot'); if(i) i.focus(); };
  const hr=$('#hresp'); if(hr) hr.onchange=e=>{ const v=e.target.value; if(v==='__otro'){ ui.respNew=true; renderDrawer(); const i=$('#hrespN'); if(i) i.focus(); return; }
    if(v) G(cod).resp=v; else delete G(cod).resp; save(); toast(v?'Responsable: '+v:'Sin responsable'); };
  const hn=$('#hrespN'); if(hn){ const ok=()=>{ if(!ui.respNew) return; const v=addGestor(hn.value); ui.respNew=false; if(v){ G(cod).resp=v; save(); toast('Responsable: '+v); } renderQuien(); renderDrawer(); };
    hn.onchange=ok; hn.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } else if(e.key==='Escape'){ e.stopPropagation(); ui.respNew=false; renderDrawer(); } }; $('#hrespX').onclick=()=>{ ui.respNew=false; renderDrawer(); }; }
  const setCond=x=>{ const G_=G(cod); if(x) G_.cond=Object.assign(x,{f:hoy(),usuario:S.config.usuario||''}); else delete G_.cond;
    if(!x||(!x.nuevo&&(x.regla!=='fecha'||x.fecha))){ const u=G_.log[G_.log.length-1], n={id:Date.now()+'_c',f:ahora(),tipo:'Sistema',texto:'Condición de pago del cliente: '+(x?condTxt(x):'vuelve al vencimiento de Tango')+'.',usuario:S.config.usuario||'',auto:true};
      if(esNotaCond(u)&&String(u.f).slice(0,10)===n.f.slice(0,10)) G_.log[G_.log.length-1]=n; else G_.log.push(n); }
    save(); recalc(); renderDrawer(); toast(x&&x.regla==='fecha'&&!x.fecha?'Elegí la fecha desde la que se cobra':'Condición de pago guardada'); const i=$('#hdias')||$('#hfecha'); if(i&&x&&(x.nuevo||x.sigue)) i.focus(); };
  const hc=$('#hcond'); if(hc) hc.onchange=e=>{ const r=e.target.value; setCond(r==='vto'?null: r==='dias'?{regla:'dias',dias:30,nuevo:1}: r==='fecha'?{regla:'fecha',fecha:'',nuevo:1}:{regla:'mes'}); if(G(cod).cond) delete G(cod).cond.nuevo; };
  const hd=$('#hdias'); if(hd){ hd.onkeydown=e=>{ ui.paso=e.key==='ArrowUp'||e.key==='ArrowDown'; }; hd.onmousedown=()=>{ ui.paso=true; };
    hd.onchange=e=>{ const sigue=!!ui.paso; ui.paso=false; setCond({regla:'dias',dias:Math.max(0,Math.round(+e.target.value||0)),sigue}); if(G(cod).cond) delete G(cod).cond.sigue; }; }
  const hf=$('#hfecha'); if(hf) hf.onchange=e=>setCond({regla:'fecha',fecha:e.target.value});
  const xv=$('#xver'); if(xv) xv.onclick=()=>{ tab='acuerdos'; ui.acu.f='todos'; closeCli(); };
  const xok=$('#xok'); if(xok){ const ok=()=>{ setExcl([cod],$('#xmot').value.trim(),$('#xrev').value); ui.xform=false; renderDrawer(); toast('Pasó a Acuerdos especiales'); }; xok.onclick=ok; $('#xmot').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } }; $('#xcx').onclick=()=>{ ui.xform=false; renderDrawer(); }; }
  const xoff=$('#xoff'); if(xoff) xoff.onclick=()=>{ quitarExcl(cod); renderDrawer(); toast('Volvió a A cobrar'); };
  $('#dclose').onclick=closeCli; $('#dtabs').onclick=e=>{const b=e.target.closest('[data-dt]');if(b){ui.dtab=b.dataset.dt;renderDrawer()}};
  if(ui.dtab==='gestion'){
    $('#gsave').onclick=()=>{ const G_=G(cod), tx=$('#gx').value.trim(), es=$('#ge').value, pf=$('#gpf').value, pm=+$('#gpm').value||0;
      if(!tx && es===G_.estado && pf===(G_.promesa?.fecha||'')){toast('Pegá la conversación o cambiá el estado.');return;}
      const gq=$('#gq'); if(gq&&gq.value.trim()) setUsuario(gq.value); if(!requireUser()) return;
      G_.log.push({id:Date.now(),f:ahora(),tipo:$('#gt').value,texto:tx,estado:es!==G_.estado?es:'',usuario:S.config.usuario||''}); asignar(cod);
      G_.estado=es; G_.promesa=pf?{fecha:pf,monto:pm}:null; save(); toast('Gestión guardada'); renderDrawer(); };
    const gq0=$('#gq'); if(gq0) gq0.onchange=e=>{ setUsuario(e.target.value); e.target.classList.toggle('falta',!S.config.usuario); };
    const w=$('#gwa'); if(w) w.onclick=()=>enviarWA(cod);
    const px=$('#gpx'); if(px) px.onclick=()=>{ const G_=G(cod), pr=G_.promesa; G_.promesa=null; G_.log.push({id:Date.now(),f:ahora(),tipo:'Nota interna',texto:'Se cerró la promesa de pago'+(pr&&pr.fecha?' del '+fd(pr.fecha):'')+'.',usuario:S.config.usuario||'',auto:true}); save(); toast('Promesa cerrada'); renderDrawer(); };
    d.querySelector('.timeline').onclick=e=>{const b=e.target.closest('[data-del]'); if(b&&confirm('¿Borrar esta gestión?')){const G_=G(cod);G_.log=G_.log.filter(x=>String(x.id)!==b.dataset.del);save();renderDrawer();}};
  }
  if(ui.dtab==='viejos'){ const pc=$('#dpc'); if(pc) pc.onclick=()=>{ pasarACobrar(cod); renderDrawer(); toast('Pasó a A cobrar con la deuda anterior incluida'); };
    const px=$('#dpx'); if(px) px.onclick=()=>{ setDep(cod,'Pendiente'); recalc(); renderDrawer(); toast('La deuda anterior volvió a Depurar'); };
    $('#dpe').onchange=e=>{setDep(cod,e.target.value);recalc();toast('Estado de depuración guardado')}; $('#dpn').onchange=e=>{G(cod).dep=Object.assign(G(cod).dep||{},{nota:e.target.value});save()}; }
  if(ui.dtab==='datos'){ $('#dwa').onchange=e=>{const v=e.target.value.trim(); if(v&&!normTel(v)){toast('Ese número no parece válido (10 dígitos con característica).');return;} G(cod).wa=v; save(); renderDrawer(); toast('Celular guardado');};
    d.querySelectorAll('[data-usar]').forEach(b=>b.onclick=()=>{ G(cod).wa=b.dataset.usar; save(); renderDrawer(); toast('Celular elegido para WhatsApp'); });
    d.querySelectorAll('.dbody [data-open]').forEach(l=>l.onclick=e=>{ e.preventDefault(); openCli(l.dataset.open,'datos'); }); }
}

// ---------- DESCARGAS ----------
let DL=null; (async()=>{ try{ if(window.claude&&window.claude.use) DL=await window.claude.use('downloads'); }catch(e){} })();
async function descargar(blob,name){
  if(DL){ try{ await DL.save({filename:name,data:blob}); return; }catch(e){ if(e&&(e.code==='declined'||e.code==='rate_limited'))return; } }
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function descargarXLSX(rows,name){ if(!rows.length){toast('No hay filas para exportar.');return;} const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Depuracion');
  descargar(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name); }

iniciarSesion();

</script>
